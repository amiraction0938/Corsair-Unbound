name: Import Corsair Unbound v1.7.0 clean source

on:
  push:
    branches:
      - release/1.7.0-clean

permissions:
  contents: write

jobs:
  import:
    if: contains(github.event.head_commit.message, '[release-import]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Rebuild repository from v1.7.0 archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/corsair-payload
          cat .release-payload/*.b64 | tr -d '\n' | base64 -d > /tmp/corsair17.zip
          rm -rf /tmp/corsair17-src
          mkdir -p /tmp/corsair17-src
          unzip -q /tmp/corsair17.zip -d /tmp/corsair17-src

          ROOT="/tmp/corsair17-src/Corsair-Unbound-1.7.0"
          test -f "$ROOT/manifest.json"

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .release-payload -exec rm -rf {} +
          cp -a "$ROOT"/. .

          rm -rf .release-payload
          rm -f .release-import-ready
          rm -f .github/workflows/import-1.7.0.yml

      - name: Write clean release documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          cat > README.md <<'EOF'
          # 🏴‍☠️ Corsair Unbound

          <p align="center"><strong>Current release: 1.7.0</strong></p>

          <h2 align="center">Security • Freedom • A Right for Everyone</h2>
          <p align="center"><strong>Nothing can limit us.</strong></p>

          <p align="center"><a href="README.fa.md"><strong>🇮🇷 Persian Documentation</strong></a></p>

          Corsair Unbound is a local-first Chrome Manifest V3 browser shield focused on deterministic navigation protection, Fortress enforcement, redirect containment, heuristic analysis, optional threat intelligence, and a polished Security Command Center dashboard.

          ## Current release

          **1.7.0 is the current release.** The repository root is the active extension source; legacy runtime trees are not part of the release tree.

          ## Highlights

          - Fortress Mode and deterministic DNR enforcement
          - Popup, new-tab, download, and redirect containment
          - Frame-level navigation isolation
          - Heuristic and behavior intelligence
          - Optional VirusTotal BYOK
          - Domain Intelligence, Activity, Evidence, Privacy, and Security Controls
          - First-launch onboarding and interactive product tour
          - Update awareness and guided update flow
          - Dark/light theme and responsive Dashboard

          ## Install

          1. Open `chrome://extensions`.
          2. Enable **Developer mode**.
          3. Choose **Load unpacked**.
          4. Select the **repository root**.
          5. Open the popup and launch **Dashboard**.

          ## Optional VirusTotal setup

          1. Sign in to VirusTotal.
          2. Obtain your API key.
          3. Open **Dashboard → API & Intelligence**.
          4. Paste the key into the local field.
          5. Save and verify.

          ## Privacy and API credentials

          Corsair Unbound follows a **local-first / BYOK** model. No personal API key is embedded in the source tree. User-supplied keys are stored locally, and supported VirusTotal requests are sent directly to VirusTotal. Extension data remains in local storage unless explicitly exported.

          See [SECURITY.md](SECURITY.md).

          ## Project structure

          ```text
          .
          ├── .github/workflows/
          ├── core/
          ├── icons/
          ├── background.js
          ├── blocked.html
          ├── blocked.js
          ├── content-frame-guard.js
          ├── content.js
          ├── popup.html / popup.css / popup.js
          ├── dashboard.html / dashboard.css / dashboard.js
          ├── manifest.json
          ├── CHANGELOG.md
          ├── LICENSE
          ├── SECURITY.md
          ├── README.md
          └── README.fa.md
          ```

          Older releases remain in Git history; they are not mixed into the active release tree.

          ## Keyboard shortcuts

          | Shortcut | Action |
          |---|---|
          | `Ctrl+Shift+F` | Toggle Fortress on the current tab |
          | `Ctrl+Shift+E` | Open the Corsair Dashboard |

          ## License

          MIT — see [LICENSE](LICENSE).
          EOF

          cat > README.fa.md <<'EOF'
          # Corsair Unbound 1.7.0

          <p align="center"><strong>نسخه فعلی: 1.7.0</strong></p>

          <h2 align="center">امنیت • آزادی • حق همه است</h2>
          <p align="center"><strong>هیچ چیزی ما را محدود نمی‌کند.</strong></p>

          <p align="center"><a href="README.md"><strong>🇬🇧 English Documentation</strong></a></p>

          ## وضعیت فعلی

          **نسخه فعال پروژه 1.7.0 است.** ریشه repository تنها سورس فعال افزونه است و runtime نسخه‌های قدیمی در آن قاطی نشده‌اند.

          ## قابلیت‌های مهم

          - Fortress Mode و اجرای سیاست‌ها با DNR
          - مهار popup، new tab، download و redirect
          - محافظت از navigation در frameها
          - تحلیل heuristic و رفتاری
          - VirusTotal به‌صورت اختیاری و BYOK
          - Domain Intelligence، Activity، Evidence و Security Controls
          - Onboarding مرحله‌به‌مرحله و Product Tour تعاملی
          - Update awareness و راهنمای به‌روزرسانی

          ## نصب

          1. به `chrome://extensions` بروید.
          2. Developer mode را فعال کنید.
          3. روی **Load unpacked** بزنید.
          4. ریشه‌ی repository را انتخاب کنید.
          5. از Popup وارد Dashboard شوید.

          برای VirusTotal، API Key خودتان را در **Dashboard → API & Intelligence** وارد و Verify کنید.

          ## حریم خصوصی

          هیچ API Key شخصی داخل source code قرار ندارد. کلید BYOK در storage محلی نگهداری می‌شود و داده‌های افزونه محلی هستند مگر اینکه خود کاربر export کند.

          ## ساختار

          ```text
          .
          ├── .github/workflows/
          ├── core/
          ├── icons/
          ├── background.js
          ├── blocked.html
          ├── blocked.js
          ├── content-frame-guard.js
          ├── content.js
          ├── popup.*
          ├── dashboard.*
          ├── manifest.json
          ├── CHANGELOG.md
          ├── SECURITY.md
          ├── README.md
          └── README.fa.md
          ```

          نسخه‌های قدیمی فقط در Git history باقی می‌مانند.
          EOF

          cat > CHANGELOG.md <<'EOF'
          # Changelog

          All notable changes to Corsair Unbound are documented here.

          ## [1.7.0] — Security Command Center

          ### Added
          - Production-style Dashboard with focused Overview, Activity, Domain Intelligence, Security, Privacy, API & Intelligence, Settings, and About views.
          - Smooth view transitions, drawers, modals, toasts, loading states, and success/error feedback.
          - First-launch onboarding and interactive product tour.
          - Clear VirusTotal BYOK setup and verification flow.
          - Update-awareness runtime with GitHub release-source checking and guided update flow.
          - Frame-level navigation guard and dedicated blocked-navigation UI.
          - Context-menu access to domain security analysis.
          - Updater runtime support in `core/updater.js`.

          ### Changed
          - Reorganized the Dashboard from a long settings page into a Security Command Center.
          - Grouped advanced security and data-management controls into dedicated views.
          - Surfaced API configuration as a first-class setup area.

          ### Security / Privacy
          - Preserved local-first storage and BYOK credential handling.
          - No personal API key or private credential is embedded in the source tree.
          - Security enforcement remains deterministic and separate from observation/telemetry.

          ## [1.6.5] — Finalized release build
          - Finalized the 1.6.5 package and release metadata.
          - Documented BYOK handling and local-first behavior.
          - Added repository validation and credential-pattern scanning.

          ## [1.5.0] — 2025
          - Heuristic Analysis Engine, alarm-based TTL handling, trust controls, download guard, keyboard shortcuts, dashboard controls, safe-list import/export, Incognito Split Mode, and automatic banner dismissal.
          - Improved Dashboard information hierarchy and Fortress TTL recovery.

          ## [1.4.0]
          - Fortress catch-all, VirusTotal BYOK, Smart Whitelist, automatic threat scanning, and Domain Analyzer.

          ## [1.3.0]
          - Fortress popup lockdown, redirect storm containment, and auto-scan notifications.

          ## [1.2.0]
          - Deterministic DNR enforcement and redirect chain tracking.

          ## [1.1.0]
          - First public release.
          EOF

          cat > SECURITY.md <<'EOF'
          # Security

          Corsair Unbound is designed to keep credentials out of the source tree.

          - Never commit API keys, OAuth tokens, cookies, passwords, or private keys.
          - VirusTotal integration is BYOK and uses a user-supplied key stored in local extension storage.
          - Do not paste credentials into issues, pull requests, or documentation.
          - Before publishing a release, run the validation workflow and review changed files.

          The 1.7.0 validation workflow checks Manifest V3 structure, JavaScript syntax, referenced files, forbidden legacy trees, and high-signal credential patterns.
          EOF

          cat > .github/workflows/validate-1.7.0.yml <<'EOF'
          name: Corsair Unbound 1.7.0 validation

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
            workflow_dispatch:

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: 20

                - name: Check JavaScript syntax
                  shell: bash
                  run: |
                    set -euo pipefail
                    for file in background.js content.js blocked.js content-frame-guard.js popup.js dashboard.js core/*.js; do
                      node --check "$file"
                    done

                - name: Validate manifest and referenced files
                  shell: bash
                  run: |
                    node <<'NODE'
                    const fs = require('fs');
                    const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
                    if (manifest.manifest_version !== 3) throw new Error('manifest_version must be 3');
                    if (manifest.version !== '1.7.0') throw new Error('expected version 1.7.0');
                    const referenced = [
                      manifest.action?.default_popup,
                      ...Object.values(manifest.icons || {}),
                      ...Object.values(manifest.action?.default_icon || {}),
                      manifest.background?.service_worker,
                      ...(manifest.content_scripts || []).flatMap(x => x.js || []),
                      ...(manifest.web_accessible_resources || []).flatMap(x => x.resources || []),
                    ].filter(Boolean);
                    for (const file of referenced) {
                      if (!fs.existsSync(file)) throw new Error('missing referenced file: ' + file);
                    }
                    NODE

                - name: Reject legacy release trees
                  shell: bash
                  run: |
                    set -euo pipefail
                    test ! -d new
                    test ! -d Corsair-Unbound-v8-fixed
                    find . -type f \( -name '*1.6.5*' -o -name '*v8*' \) -print -quit | grep -q . && exit 1 || true

                - name: Scan for high-signal credentials
                  shell: bash
                  run: |
                    node <<'NODE'
                    const fs = require('fs');
                    const path = require('path');
                    const root = process.cwd();
                    const extensions = new Set(['.js','.json','.html','.css','.md','.txt']);
                    const blocked = [
                      /ghp_[A-Za-z0-9]{20,}/,
                      /github_pat_[A-Za-z0-9_]{20,}/,
                      /sk-[A-Za-z0-9]{16,}/,
                      /AIza[0-9A-Za-z_-]{20,}/,
                      /xox[baprs]-[0-9A-Za-z-]{10,}/,
                      /Bearer\s+[A-Za-z0-9._-]{20,}/i,
                      /-----BEGIN [A-Z ]+PRIVATE KEY-----/,
                      /\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b/,
                      /(?:api[_-]?key|access[_-]?token|client[_-]?secret|password)\s*[:=]\s*["']([^"']{12,})["']/i
                    ];
                    const hits=[];
                    function walk(dir){
                      for(const e of fs.readdirSync(dir,{withFileTypes:true})){
                        const p=path.join(dir,e.name);
                        if(e.isDirectory() && !['.git'].includes(e.name)) walk(p);
                        else if(e.isFile() && extensions.has(path.extname(e.name).toLowerCase())){
                          fs.readFileSync(p,'utf8').split(/\r?\n/).forEach((line,i)=>{
                            if(blocked.some(re=>re.test(line))) hits.push(path.relative(root,p)+':'+(i+1));
                          });
                        }
                      }
                    }
                    walk(root);
                    if(hits.length) throw new Error('Potential credential pattern(s): '+hits.join(', '));
                    NODE
          EOF

      - name: Commit clean 1.7.0 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "corsair-unbound-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: Corsair Unbound v1.7.0"
          git push origin HEAD:release/1.7.0-clean
