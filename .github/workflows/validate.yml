name: Corsair Unbound validation

on:
  push:
    branches:
      - "final/corsair-unbound-complete"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check runtime
        shell: bash
        run: |
          set -e
          node --check background.js
          node --check content.js
          node --check popup.js
          node --check dashboard.js
          for f in core/*.js; do
            node --check "$f"
          done
      - name: Validate manifest
        run: node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.json','utf8')); if(m.manifest_version!==3) throw new Error('manifest_version must be 3'); if(m.version!=='1.1.0') throw new Error('version mismatch'); for(const p of [m.action?.default_popup,...Object.values(m.icons||{}),...Object.values(m.action?.default_icon||{})]) if(p && !fs.existsSync(p)) throw new Error('missing file: '+p);"
      - name: Focused self-test
        run: node tests/self-test.mjs
