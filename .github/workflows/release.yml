name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must be vMAJOR.MINOR.PATCH (stable only), got: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        run: npm test

      - name: Build distributable
        run: node scripts/build.mjs

      - name: Validate built manifest
        run: |
          MANIFEST_VERSION=$(node -p "require('./dist/manifest.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then exit 1; fi

      - name: Create extension ZIP
        run: |
          cd dist
          zip -r ../corsair-unbound-extension.zip . -x '*.DS_Store' '__MACOSX/*' '*/.*'
          cd ..

      - name: Compute SHA-256
        run: |
          SHA=$(sha256sum corsair-unbound-extension.zip | awk '{print $1}')
          echo "$SHA" > sha256.txt

      - name: Prepare launcher assets
        run: |
          cp launcher/updater.ps1 corsair-unbound-updater.ps1
          cp launcher/updater.bat corsair-unbound-updater.bat

      - name: Generate latest.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(cat sha256.txt)
          PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > latest.json <<EOF
          {
            "version": "${TAG_VERSION}",
            "tag": "${GITHUB_REF_NAME}",
            "download_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/corsair-unbound-extension.zip",
            "sha256": "${SHA}",
            "published_at": "${PUBLISHED_AT}",
            "notes": "",
            "mandatory": false
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Corsair Unbound ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            corsair-unbound-extension.zip
            corsair-unbound-updater.ps1
            corsair-unbound-updater.bat
            latest.json
            sha256.txt
          body: |
            ## 🛡️ Corsair Unbound ${{ github.ref_name }} is here!

            Welcome to the latest release of Corsair Unbound! Updating is safe, fast, and keeps all your settings intact.

            ### 📦 What's inside the Assets?
            - `corsair-unbound-updater.bat` 👈 **Double-click this to update!**
            - `corsair-unbound-extension.zip`: The main extension file (for manual clean installs).
            - `latest.json` & `sha256.txt`: Security files used by the updater.

            ### 🚀 How to Update (The Easy Way)
            1. Scroll down and download **`corsair-unbound-updater.bat`**.
            2. **Double-click** the downloaded `.bat` file. *(No PowerShell errors guaranteed!)*
            3. The script will automatically find your Corsair Unbound folder and update it securely.
            4. Wait for the green text saying "Update complete".
            5. Reload the extension in `chrome://extensions`.

            > **🛡️ Why is this safe?** The updater downloads the official release directly from GitHub, verifies its SHA-256 hash to prevent tampering, and creates a backup before replacing any files. Your data lives in Chrome, so it is never touched.

            ---

            <div dir="rtl" align="right">

            ## 🛡️ نسخه جدید Corsair Unbound ${{ github.ref_name }} منتشر شد!

            به نسخه جدید Corsair Unbound خوش آمدید! آپدیت کردن کاملاً امن و سریع است و هیچ‌کدام از تنظیمات شما پاک نمی‌شود.

            ### 📦 فایل‌های موجود در این بخش چه هستند؟
            - `corsair-unbound-updater.bat` 👈 **برای آپدیت، روی این فایل دابل‌کلیک کنید!**
            - `corsair-unbound-extension.zip`: فایل اصلی افزونه (برای نصب دستی).
            - `latest.json` و `sha256.txt`: فایل‌های امنیتی که آپدیتر از آن‌ها استفاده می‌کند.

            ### 🚀 چطور آپدیت کنیم؟ (روش بسیار ساده)
            ۱. به پایین صفحه بروید و فایل **`corsair-unbound-updater.bat`** را دانلود کنید.
            ۲. روی فایل `.bat` دانلود شده **دابل‌کلیک** کنید. *(دیگر هیچ خطای PowerShell دریافت نمی‌کنید!)*
            ۳. اسکریپت به طور خودکار پوشه افزونه شما را پیدا می‌کند و آن را به صورت امن آپدیت می‌کند.
            ۴. صبر کنید تا متن سبز رنگ "Update complete" نمایش داده شود.
            ۵. افزونه را در صفحه `chrome://extensions` مجدداً Reload کنید.

            > **🛡️ چرا این کار امن است؟** آپدیتر فایل رسمی را مستقیماً از گیت‌هاب دانلود می‌کند، هش SHA-256 آن را برای جلوگیری از دستکاری بررسی می‌کند و قبل از جایگزینی هر فایلی، یک نسخه پشتیبان (Backup) می‌گیرد. داده‌های شما در کروم ذخیره می‌شوند و هرگز دست نمی‌خورند.

            </div>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}