name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must be vMAJOR.MINOR.PATCH (stable only), got: ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "Tag OK: ${GITHUB_REF_NAME}"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests
        run: npm test

      - name: Build distributable
        run: node scripts/build.mjs

      - name: Validate built manifest
        run: |
          if [ ! -f dist/manifest.json ]; then
            echo "::error::dist/manifest.json was not produced by the build"
            exit 1
          fi
          MANIFEST_VERSION=$(node -p "require('./dist/manifest.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi
          echo "Version OK: $MANIFEST_VERSION"

      - name: Create extension ZIP
        run: |
          cd dist
          zip -r ../corsair-unbound-extension.zip . -x '*.DS_Store' '__MACOSX/*' '*/.*'
          cd ..

      - name: Verify ZIP contents
        run: |
          if ! unzip -l corsair-unbound-extension.zip | grep -q 'manifest.json'; then
            echo "::error::ZIP does not contain manifest.json"
            exit 1
          fi
          echo "ZIP contents look correct"

      - name: Compute SHA-256
        run: |
          SHA=$(sha256sum corsair-unbound-extension.zip | awk '{print $1}')
          echo "$SHA" > sha256.txt
          echo "SHA256: $SHA"

      - name: Prepare launcher asset
        run: |
          if [ ! -f launcher/updater.ps1 ]; then
            echo "::error::launcher/updater.ps1 not found"
            exit 1
          fi
          cp launcher/updater.ps1 corsair-unbound-updater.ps1

      - name: Generate latest.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(cat sha256.txt)
          PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > latest.json <<EOF
          {
            "version": "${TAG_VERSION}",
            "tag": "${GITHUB_REF_NAME}",
            "download_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/corsair-unbound-extension.zip",
            "sha256": "${SHA}",
            "published_at": "${PUBLISHED_AT}",
            "notes": "",
            "mandatory": false
          }
          EOF

      - name: Debug - List files before upload
        run: |
          echo "=== Files in root directory ==="
          ls -la
          echo "=== Checking required files ==="
          ls -la corsair-unbound-extension.zip corsair-unbound-updater.ps1 latest.json sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Corsair Unbound ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            corsair-unbound-extension.zip
            corsair-unbound-updater.ps1
            latest.json
            sha256.txt
          body: |
            ## 🛡️ Corsair Unbound ${{ github.ref_name }} is out!

            Hello! If you are an ordinary user (not a developer), please don't panic. Updating is very easy and takes less than a minute.

            ### 📦 What are these files?
            - `corsair-unbound-extension.zip`: The main extension file. (For manual updates)
            - `corsair-unbound-updater.ps1`: The **Magic Updater**. It downloads, verifies, backs up, and installs the new version automatically!
            - `latest.json` & `sha256.txt`: Security files used by the updater. You don't need to touch them.

            ### 🚀 How to update (The Easy Way)
            1. Download `corsair-unbound-updater.ps1` below.
            2. Right-click the file and choose **Run with PowerShell**.
            3. Select your extension folder when the window pops up.
            4. Wait for the green text to say "Update complete"!
            5. Open `chrome://extensions` and click the Reload (↻) button.

            *(If Windows blocks the script, open PowerShell and run: `powershell -ExecutionPolicy Bypass -File .\corsair-unbound-updater.ps1`)*

            ---

            ## 🛡️ نسخه جدید Corsair Unbound ${{ github.ref_name }} منتشر شد!

            سلام! اگر شما یک کاربر عادی هستید (نه برنامه‌نویس)، نگران نباشید. آپدیت کردن خیلی ساده است و کمتر از یک دقیقه وقت می‌گیرد.

            ### 📦 این فایل‌ها چی هستند؟
            - `corsair-unbound-extension.zip`: فایل اصلی افزونه (برای آپدیت دستی).
            - `corsair-unbound-updater.ps1`: **آپدیتر جادویی**. این فایل نسخه جدید را دانلود، تأیید و بکاپ‌گیری می‌کند و به صورت خودکار نصب می‌کند!
            - `latest.json` و `sha256.txt`: فایل‌های امنیتی که آپدیتر از آن‌ها استفاده می‌کند. نیازی نیست به آن‌ها دست بزنید.

            ### 🚀 چطور آپدیت کنیم؟ (روش ساده)
            ۱. فایل `corsair-unbound-updater.ps1` را از پایین دانلود کنید.
            ۲. روی فایل دانلود شده راست‌کلیک کنید و گزینه **Run with PowerShell** را بزنید.
            ۳. یک پنجره باز می‌شود که از شما پوشه افزونه را می‌خواهد. پوشه‌ای که `manifest.json` دارد را انتخاب کنید.
            ۴. صبر کنید تا متن سبز رنگ "Update complete" نمایش داده شود!
            ۵. به صفحه `chrome://extensions` بروید و روی دکمه Reload (↻) کنار Corsair Unbound کلیک کنید.

            *(اگر ویندوز اجرای اسکریپت را بلاک کرد، PowerShell را باز کنید و این را بزنید: `powershell -ExecutionPolicy Bypass -File .\corsair-unbound-updater.ps1`)*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}